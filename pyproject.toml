[tool.poetry]
name = "italian_card_games"
packages = [
    { include = "italian_card_games" },
]
version = "2.4.1"
description = "Italian card games (e.g. Briscola, Scopa) with a clean, testable game engine"
authors = ["Davide Mengoli <davide.mengoli4@studio.unibo.it>"]
license = "Apache-2.0"
readme = "README.md"

[tool.poetry.dependencies]
# update the Python versions in .github/workflows/check.yml if you change this
python = ">= 3.11.0 < 4.0.0"
sqlalchemy = "^2.0"

[tool.poetry.group.dev.dependencies]
coverage = "^7.4.0"
mypy = "^1.10.1"
poethepoet = "^0.37.0"
poetry = "^1.8.3"
pytest = "^8.3.5"
ruff = "^0.15.0"

[tool.poe.tasks]
test = "pytest"
coverage = "coverage run -m pytest"
coverage-report = "coverage report -m"
coverage-html = "coverage html"
ruff-check = "ruff check"
ruff-fix = "ruff check --fix"
format = "ruff format"
format-check = "ruff format --check"
mypy = "mypy italian_card_games tests"
compile = "python -m compileall italian_card_games tests"
static-checks = [
    "ruff-check",
    "mypy",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
